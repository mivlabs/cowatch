[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["frontend", "**/dist", "**/__pycache__"]

[tool.ruff.lint]
# Стартовый набор: синтаксис, неиспользуемые импорты/переменные, порядок импортов.
# Раздутый rule-set из коробки на legacy-коде даёт сотни шумных срабатываний —
# включаем остальное (B, UP, SIM...) по мере рефакторинга.
select = ["E", "F", "I"]
ignore = ["E501"]
